spring:
  config:
    import: optional:file:.env.test[.properties]
  application:
    name: exchange-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${EXCHANGE_DATASOURCE_URL_TEST}
    username:  ${DATASOURCE_USER_TEST}
    password:  ${DATASOURCE_PASSWORD_TEST}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
  web:
    error:
      include-stacktrace: never
      include-message: always
management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessstate:
      enabled: true
#  tracing:
#    sampling:
#      # Recomendado 0.05 em prod
#      probability: 1.0
#    export:
#      zipkin:
#        endpoint: ${MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT:http://localhost:9411}
server:
  port: 8000


