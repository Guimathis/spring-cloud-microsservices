spring:
  application:
    name: exchange-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/exchange-db
    username: postgres
    password: admin
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:

server:
  port: ${SERVER_PORT:8000}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

# Caminho para as docs openApi
springdoc:
  api-docs:
    path: /exchange-service/v3/api/docs