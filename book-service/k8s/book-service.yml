apiVersion: v1
kind: Service
metadata:
  name: book-service
  namespace: microservices
spec:
  type: LoadBalancer
  selector:
    app: book-service
  ports:
    - port: 8100
      targetPort: 8100
---
apiVersion: v1
kind: Namespace
metadata:
  name: microservices
---
apiVersion: v1
kind: ConfigMap
data:
  EXCHANGE_SERVICE_URL: http://exchange-service:8000
metadata:
  name: book-service-config
  namespace: microservices
