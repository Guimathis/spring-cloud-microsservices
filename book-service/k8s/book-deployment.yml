apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-service
  namespace: microservices
  labels:
    app: book-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: book-service
  template:
    metadata:
      labels:
        app: book-service
    spec:
      containers:
      - name: book-service
        image: guimathis/book-service:latest
        ports:
        - containerPort: 8100
        envFrom:
        - configMapRef:
            name: book-service-config
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8100
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8100
