apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-service
  namespace: microservices
  labels:
    app: book-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: book-service
  template:
    metadata:
      labels:
        app: book-service
    spec:
      containers:
      - name: book-service
        image: guimathis/book-service:latest
        ports:
        - containerPort: 8100
# O Spring Boot tem um recurso chamado Relaxed Binding.
#  Ele converte automaticamente variáveis de ambiente em letras maiúsculas (com underscores)
#  para as propriedades do application.properties ou application.yml.
        env:
          - name: SPRING_DATASOURCE_URL
            valueFrom:
              secretKeyRef:
                name: app-secrets
                key: BOOK_DATASOURCE_URL
          - name: SPRING_DATASOURCE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: app-secrets
                key: BOOK_DATASOURCE_PASSWORD
          - name: SPRING_DATASOURCE_USERNAME
            valueFrom:
              secretKeyRef:
                name: app-secrets
                key: BOOK_DATASOURCE_USERNAME
          - name: SERVER_PORT
            valueFrom:
              secretKeyRef:
                name: app-secrets
                key: BOOK_SERVICE_PORT
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8100
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8100
