apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-service
  namespace: microservices
  labels:
    app: book-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: book-service
  template:
    metadata:
      labels:
        app: book-service
    spec:
      containers:
      - name: book-service
        image: guimathis/book-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8100
        env:
          - name: SPRING_DATASOURCE_URL
            valueFrom:
              secretKeyRef:
                name: deploy-secrets
                key: BOOK_DATASOURCE_URL
          - name: SPRING_DATASOURCE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: deploy-secrets
                key: DATASOURCE_PASSWORD
          - name: SPRING_DATASOURCE_USERNAME
            valueFrom:
              secretKeyRef:
                name: deploy-secrets
                key: DATASOURCE_USERNAME

          - name: EXCHANGE_SERVICE_URL
            valueFrom:
              configMapKeyRef:
                name: book-service-config
                key: EXCHANGE_SERVICE_URL

        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8100
          failureThreshold: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8100
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8100
