spring:
  application:
    name: book-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/booking-db}
    username: ${DATASOURCE_USER:postgres}
    password: ${DATASOURCE_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessstate:
      enabled: true

  #  tracing:
  #    sampling:
  #      # Recomendado 0.05 em prod
  #      probability: 1.0
  #    export:
  #      zipkin:
  #        endpoint: ${MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT:http://localhost:9411}
  endpoints:
    web:
      exposure:
        include: "*"

resilience4j:
  circuitbreaker:
    instances:
      exchange-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 10s
  retry:
    instances:
      exchange-service:
        maxAttempts: 3
        waitDuration: 1s
  ratelimiter:
    instances:
      exchange-service:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 0

server:
  port: 8100

#eureka:
#  client:
#    service-url:
#      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
#  instance:
#    prefer-ip-address: true

# Caminho para as docs openApi
springdoc:
  api-docs:
    path: /book-service/v3/api/docs
  override-server-url: true
