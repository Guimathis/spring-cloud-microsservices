spring:
  config:
    import: optional:file:./book-service/.env[.properties]
  application:
    name: book-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USER}
    password: ${DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    generate-ddl: false
  ai:
    google:
      genai:
        api-key: ${GOOGLE_GENAI_APIKEY}
        chat:
          model: gemini-3.5-flash-lite
management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessstate:
      enabled: true

  #  tracing:
  #    sampling:
  #      # Recomendado 0.05 em prod
  #      probability: 1.0
  #    export:
  #      zipkin:
  #        endpoint: ${MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT:http://localhost:9411}
  endpoints:
    web:
      exposure:
        include: "*"

resilience4j:
  circuitbreaker:
    instances:
      exchange-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 10s
      review-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 10s
  retry:
    instances:
      exchange-service:
        maxAttempts: 3
        waitDuration: 1s
      review-service:
        maxAttempts: 3
        waitDuration: 1s
  ratelimiter:
    instances:
      exchange-service:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 0
      review-service:
        limitForPeriod: 5
        limitRefreshPeriod: 1s
        timeoutDuration: 0

server:
  port: 8100

#eureka:
