spring:
  config:
    import: optional:file:.env.test[.properties]
  application:
    name: book-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATASOURCE_URL_TEST}
    username: ${DATASOURCE_USER_TEST}
    password: ${DATASOURCE_PASSWORD_TEST}
  jpa:
    hibernate:
      ddl-auto: validate
    generate-ddl: false
  ai:
    google:
      genai:
        api-key: ${GOOGLE_GENAI_APIKEY}
        chat:
          model: gemini-3.5-flash-lite
  web:
    error:
      include-stacktrace: never
      include-message: always
management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"

resilience4j:
  circuitbreaker:
    instances:
      exchange-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 10s
      review-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 10s
  retry:
    instances:
      exchange-service:
        maxAttempts: 3
        waitDuration: 1s
      review-service:
        maxAttempts: 3
        waitDuration: 1s
  ratelimiter:
    instances:
      exchange-service:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 0
      review-service:
        limitForPeriod: 5
        limitRefreshPeriod: 1s
        timeoutDuration: 0

server:
  port: 8100

