name: CI Spring Cloud API Gateway

on:
  push:
    branches: [ "master" ]
    paths:
      - 'spring-cloud-api-gateway/**'
  workflow_dispatch:

jobs:
  call-template:
    # Chama o arquivo base que criamos acima
    uses: ./.github/workflows/template-docker-image-push.yml
    # Passa as informações específicas deste serviço
    with:
      working_directory: './spring-cloud-api-gateway'
      image_name: 'spring-cloud-api-gateway'
    # Repassa os secrets do repositório para o template
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_ACCESS_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}