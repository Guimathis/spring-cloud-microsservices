name: template-docker-image-push.yml

on:
  workflow_call:
    # Define os parâmetros que os serviços vão passar para cá
    inputs:
      working_directory:
        required: true
        type: string
      image_name:
        required: true
        type: string
      manifests_path:
        required: true
        type: string
    # Define os secrets que o template vai precisar
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_ACCESS_TOKEN:
        required: true
      BOOK_DATASOURCE_URL:
        required: false
      EXCHANGE_DATASOURCE_URL:
        required: false
      DATASOURCE_PASSWORD:
        required: true
      DATASOURCE_USERNAME:
        required: true
      DATASOURCE_URL_TEST:
        required: true
      DATASOURCE_USER_TEST:
        required: true
      DATASOURCE_PASSWORD_TEST:
        required: true
      GOOGLE_GENAI_APIKEY:
        required: false

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Tests
        env:
          DATASOURCE_URL_TEST: ${{ secrets.DATASOURCE_URL_TEST  }}
          DATASOURCE_USER_TEST:  ${{ secrets.DATASOURCE_USER_TEST  }}
          DATASOURCE_PASSWORD_TEST:  ${{ secrets.DATASOURCE_PASSWORD_TEST  }}
          GOOGLE_GENAI_APIKEY: ${{ secrets.GOOGLE_GENAI_APIKEY }}
        run: |
          mvn test -f ${{ inputs.working_directory }}/pom.xml

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ inputs.image_name }}
          path: ${{ inputs.working_directory }}/target/surefire-reports/
          retention-days: 7

  CI:

    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.working_directory }}
          file: ${{ inputs.working_directory }}/Dockerfile
          push: true
          # Cria duas tags: a "latest" e uma com o hash do commit para versionamento
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:${{ github.sha }}

  CD:

    runs-on: ubuntu-latest
    needs: [CI]

    steps:
      - uses: actions/checkout@v4

      - name: Etapa de deploy no Kubernetes (Desativada)
        run: |
          echo "=================================================================================="
