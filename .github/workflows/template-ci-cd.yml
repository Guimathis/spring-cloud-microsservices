          echo "  3. Atualização dos Secrets no namespace 'microservices'"
          echo "  4. Aplicação dos manifestos K8s com a imagem: ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:${{ github.sha }}"
