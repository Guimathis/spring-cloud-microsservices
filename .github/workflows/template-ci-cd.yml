name: template-docker-image-push.yml

on:
  workflow_call:
    # Define os parâmetros que os serviços vão passar para cá
    inputs:
      working_directory:
        required: true
        type: string
      image_name:
        required: true
        type: string
      manifests_path:
        required: true
        type: string
    # Define os secrets que o template vai precisar
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_ACCESS_TOKEN:
        required: true

jobs:

  CI:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.working_directory }}
          file: ${{ inputs.working_directory }}/Dockerfile
          push: true
          # Cria duas tags: a "latest" e uma com o hash do commit para versionamento
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:${{ github.sha }}

  CD:

    runs-on: ubuntu-latest
    needs: [CI]

    steps:
      - uses: actions/checkout@v4

      - name: Criar ou atualizar Secrets no Cluster
        run: |
          kubectl create secret generic deploy-secrets \
            --from-literal=API_KEY=${{ secrets.BOOK_DATASOURCE_URL }} \
            --from-literal=API_KEY=${{ secrets.EXCHANGE_DATASOURCE_URL }} \
            --from-literal=DB_PASSWORD=${{ secrets.DATASOURCE_PASSWORD }} \
            --from-literal=API_KEY=${{ secrets.DATASOURCE_USERNAME }} \
            --dry-run=client -o yaml | kubectl apply -f -  

      - name: Autenticar no Google Cloud
        id: auth
        uses: 'google-github-actions/auth@v3'
        with:
          # Cole aqui o resultado do Passo 2
          workload_identity_provider: 'projects/741916121845/locations/global/workloadIdentityPools/github-pool/providers/github-actions-provider'
          service_account: 'github-actions-sa@microservices-cloud-deployment.iam.gserviceaccount.com'
  
      - name: Deploy to Kubernetes cluster
        uses: Azure/k8s-deploy@v4.9
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:${{ github.sha }}
          manifests:
            $ {{ manifests_path }}
