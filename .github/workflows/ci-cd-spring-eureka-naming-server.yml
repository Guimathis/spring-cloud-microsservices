name: CI/CD Spring Cloud Eureka Naming Server

on:
  push:
    branches: [ "master" ]
    paths:
      - 'spring-eureka-naming-server/**'
  workflow_dispatch:
jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./spring-eureka-naming-server
          file: ./spring-eureka-naming-server/Dockerfile
          push: true
          # Cria duas tags: a "latest" e uma com o hash do commit para versionamento
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/eureka-naming-server:latest
            ${{ secrets.DOCKER_USERNAME }}/eureka-naming-server:${{ github.sha }}