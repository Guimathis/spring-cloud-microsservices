name: CI Spring Cloud Eureka Naming Server

on:
  push:
    branches: [ "master" ]
    paths:
      - 'spring-eureka-naming-server/**'
  workflow_dispatch:

jobs:
  call-template:
    # Chama o arquivo base que criamos acima
    uses: ./.github/workflows/template-docker-image-push.yml
    # Passa as informações específicas deste serviço
    with:
      working_directory: './spring-eureka-naming-server'
      image_name: 'spring-eureka-naming-server'
    # Repassa os secrets do repositório para o template
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_ACCESS_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}