name: CI Booking service

on:
  push:
    branches: [ "k8s" ]
    paths:
      - 'book-service/**'
  workflow_dispatch:

jobs:
  call-template:
    # Chama o arquivo base que criamos acima
    uses: ./.github/workflows/template-ci-cd.yml
    # Passa as informações específicas deste serviço
    with:
      working_directory: './book-service'
      image_name: 'book-service'
      manifests_path: 'book-service/k8s'
    # Repassa os secrets do repositório para o template
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_ACCESS_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}